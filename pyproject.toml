[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phi_works_maker"
version = "0.3.0"
description = "DIY physical design, FreeCAD CAD modeling, modular component libraries, and fabrication documentation suite."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "phi ARCHITECT", email = "phi@phiarchitect.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
